<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App 2025</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7622d2a538.js" crossorigin="anonymous"></script>
</head>
<body>
    <h1 class="h">My Weather App</h1>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="error">
            Invalid City Name!!
        </div>
        <div class="weather">
            <i class="fa-solid fa-cloud-sun"></i>
            <h1 class="temperature">25°C</h1>
            <h2 class="city">Lucknow</h2>
            <div class="details">
                <div class="column-1">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <p class="Wind">15km/hr</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
                <div class="column-2">
                    <i class="fa-solid fa-sun"></i>
                    <div>
                        <p class="Humidity">50%</p>
                        <p>Humidity</p>
                    </div>

                    

                </div>

            </div>



        </div>
    </div>

<script src="script.js">
</script>   
    
</body>
</html>
